[datos]
ruta = "datos/creadores.csv"
columnas_excluidas = ["price_ars", "estimated_argentina_reach", "total_engagement_per_1000", "organic_posts_pct"]

[modelo]
grilla = 5
topologia = "rectangular"
distancia = "euclidiana"
inicializacion = "uniforme"
radio_inicial_relativo = 0.3
radio_final = 1.0
decaimiento_radio = "lineal"
eta_inicial = 0.7
eta_final = 0.001
decaimiento_eta = "exponencial"
iteraciones = 15000

[reproducibilidad]
semillas = [0, 1, 2]
semilla_representativa = 0

[salida]
directorio = "resultados/ej1/kohonen_k5"
