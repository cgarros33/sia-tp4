[base]
archivo = "src/ej1/kohonen.toml"

[barrido]
orden = ["grilla", "topologia", "distancia", "inicializacion", "radio_inicial_relativo", "decaimiento_radio", "eta_inicial", "decaimiento_eta", "iteraciones"]
semillas = [0, 1, 2]
criterio_grilla = "codo"
tolerancia_codo = 0.05

[valores]
grilla = [3, 4, 5, 6, 7, 8, 10]
topologia = ["rectangular", "hexagonal"]
distancia = ["euclidiana", "exponencial"]
inicializacion = ["uniforme", "muestras"]
radio_inicial_relativo = [0.5, 0.75, 1.0, 1.5]
decaimiento_radio = ["constante", "lineal", "exponencial", "inversa"]
eta_inicial = [0.01, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.9]
decaimiento_eta = ["lineal", "exponencial", "inversa"]
iteraciones = [5000, 10000, 20000, 40000, 80000]

[acoplamientos]
pares = [["eta_inicial", "decaimiento_eta"], ["radio_inicial_relativo", "decaimiento_radio"]]
adoptar_solo_si_mejora = true

[figuras]
opciones = ["a", "b", "c"]

[salida]
directorio = "resultados/ej1/kohonen_sweep"
directorio_final = "resultados/ej1/kohonen"
