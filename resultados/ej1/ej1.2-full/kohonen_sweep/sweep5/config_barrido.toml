[base]
archivo = "src/ej1/kohonen.toml"

[barrido]
grillas_fijas = [5]
orden = ["topologia", "distancia", "inicializacion", "radio_inicial_relativo", "decaimiento_radio", "eta_inicial", "decaimiento_eta", "iteraciones"]
semillas = [0, 1, 2]

[valores]
topologia = ["rectangular", "hexagonal"]
distancia = ["euclidiana", "exponencial"]
inicializacion = ["uniforme", "muestras"]
radio_inicial_relativo = [0.3, 0.4, 0.5, 0.75, 1.0, 1.5]
decaimiento_radio = ["constante", "lineal", "exponencial", "inversa"]
eta_inicial = [0.01, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.9]
decaimiento_eta = ["lineal", "exponencial", "inversa"]
iteraciones = [5000, 10000, 15000, 25000]

[acoplamientos]
pares = [["eta_inicial", "decaimiento_eta"], ["radio_inicial_relativo", "decaimiento_radio"]]
adoptar_solo_si_mejora = true

[figuras]
opciones = ["a", "b"]

[salida]
directorio = "resultados/ej1/kohonen_sweep/sweep5"
directorio_final_base = "resultados/ej1/kohonen"
directorio_final = "resultados/ej1/kohonen_k5"
